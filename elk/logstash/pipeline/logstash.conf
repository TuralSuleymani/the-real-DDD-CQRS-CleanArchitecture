input {
  http {
    port => 8080
    codec => json
  }
}

filter {

  ##############################################
  # 1. Add standard metadata
  ##############################################
  mutate {
    add_field => {
      "service"     => "%{[Properties][ServiceName]}"
      "environment" => "production"
      "node"        => "${HOSTNAME}"
    }
  }

  ##############################################
  # 2. Mask sensitive fields
  ##############################################
  mutate {
    replace => {
      "[User][Password]" => "[MASKED]"
      "password"         => "[MASKED]"
      "secret"           => "[MASKED]"
      "token"            => "[MASKED]"
      "apiKey"           => "[MASKED]"
    }
  }

  mutate {
    gsub => [
      "message", "(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", "[EMAIL_MASKED]"
    ]
  }

  mutate {
    gsub => [
      "message", "(\\+?\\d{1,3})?[-.\\s]?\\d{3}[-.\\s]?\\d{3,4}[-.\\s]?\\d{4}", "[PHONE_MASKED]"
    ]
  }

  mutate {
    gsub => [
      "message", "\\b(?:\\d[ -]*?){13,16}\\b", "[CARD_MASKED]"
    ]
  }

  mutate {
    gsub => [
      "message", "\\b[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\\b", "[IBAN_MASKED]"
    ]
  }

  ##############################################
  # 3. Remove useless fields
  ##############################################
  mutate {
    remove_field => [
      "Headers",
      "host",
      "@version",
      "[Properties][SourceContext]",
      "[Properties][RequestPath]"
    ]
  }

  ##############################################
  # 4. Flatten nested Serilog properties
  ##############################################
  if [Properties] {
    mutate { rename => { "Properties" => "props" } }

    ruby {
      code => '
        event.get("props").each { |k,v|
          event.set(k, v)
        }
        event.remove("props")
      '
    }
  }

  ##############################################
  # 5. Convert Timestamp to @timestamp
  ##############################################
  if [Timestamp] {
    date {
      match  => ["Timestamp", "ISO8601"]
      target => "@timestamp"
    }
    mutate { remove_field => ["Timestamp"] }
  }

  ##############################################
  # 6. Parse exceptions
  ##############################################
  if "Exception" in [message] or [Exception] {
    mutate { rename => { "Exception" => "exception" } }

    grok {
      match => {
        "exception" => [
          "(?m)%{GREEDYDATA:exception_message}\n%{GREEDYDATA:stack_trace}"
        ]
      }
      tag_on_failure => []
    }
  }

  ##############################################
  # 7. Lowercase fields
  ##############################################
  mutate {
    lowercase => ["service", "environment"]
  }

  ##############################################
  # 8. Drop DEBUG / TRACE logs in production
  ##############################################
  if [Level] =~ /Debug|Verbose|Trace/ {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservice-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}